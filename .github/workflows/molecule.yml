---
name: Ansible Molecule Workflow

# Run this workflow every time a new commit pushed to your repository
on:
  push:
  pull_request:
    branches: [master, main]

env:
  ANSIBLE_ROLE: 'jkirk.proxmox'

jobs:
  molecule:
    # Name the Job
    name: Ansible Molecule
    # Set the agent to run on
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target-distro:
          - debian12
          - debian13
        ansible-core-version:
          - '2.16.0'
          - '2.18.0'
        python-version:
          - '3.11'
          - '3.13'

    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      # Checks out a copy of your repository on the ubuntu-latest machine
      - name: Check out code base
        uses: actions/checkout@v5
        with:
          path: ${{ env.ANSIBLE_ROLE }}

      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."

      - name: Set up Python3
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip3 install ansible-core~=${{ matrix.ansible-core-version }} molecule molecule-plugins[docker]

      - name: Check ansible version
        run: ansible --version

      - name: Check molecule version
        run: molecule --version

      - name: Run molecule test
        run: molecule test
        working-directory: ${{ env.ANSIBLE_ROLE }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.target-distro }}
